name: Update Organization Stats Badges

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-org-stats.yml'

jobs:
  update-badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recompute stats and push badge updates to main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_ORG_SYNC_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const org = 'QLS-MiCM';
            const excludedFromWorkshops = new Set([
              'Workshop_Template',
              'MiCM_PR_Bot',
              '.github'
            ]);
            const readmePath = 'profile/README.md';
            const badgeStart = '<!-- org-stats-badges -->';
            const badgeEnd = '<!-- /org-stats-badges -->';
            const owner = github.context.repo.owner;
            const repoName = github.context.repo.repo;

            function isBot(contributor) {
              if (!contributor?.login) return true;
              if (contributor.type === 'Bot') return true;
              if (contributor.login.endsWith('[bot]')) return true;
              return false;
            }

            function renderBadgeBlock(workshops, contributors) {
              return [
                badgeStart,
                `![Workshops](https://img.shields.io/badge/Workshops-${workshops}-blue?style=flat&logo=github&logoColor=white)`,
                `![Stars](https://img.shields.io/github/stars/${org}?style=flat&logo=github&label=Stars)`,
                `![Contributors](https://img.shields.io/badge/Contributors-${contributors}-orange?style=flat&logo=github&logoColor=white)`,
                badgeEnd
              ].join('\n');
            }

            async function listOrgRepos() {
              return github.paginate(github.rest.repos.listForOrg, {
                org,
                per_page: 100,
                type: 'all'
              });
            }

            async function uniqueHumanContributors(repos) {
              const logins = new Set();
              const errors = [];

              for (const repo of repos) {
                try {
                  const contributors = await github.paginate(
                    github.rest.repos.listContributors,
                    {
                      owner: repo.owner.login,
                      repo: repo.name,
                      per_page: 100
                    }
                  );

                  for (const contributor of contributors) {
                    if (!isBot(contributor)) {
                      logins.add(contributor.login);
                    }
                  }
                } catch (error) {
                  if (error.status === 204) continue;
                  errors.push(`${repo.owner.login}/${repo.name}: ${error.message}`);
                  core.warning(
                    `Failed to list contributors for ${repo.owner.login}/${repo.name}: ${error.message}`
                  );
                }
              }

              return { count: logins.size, errors };
            }

            const repos = await listOrgRepos();
            const workshops = repos.filter(
              (repo) => !excludedFromWorkshops.has(repo.name)
            ).length;
            const { count: contributors, errors } = await uniqueHumanContributors(repos);

            const readmeAbs = path.join(process.env.GITHUB_WORKSPACE, readmePath);
            const currentReadme = fs.readFileSync(readmeAbs, 'utf8');
            const badgeBlockRe = new RegExp(
              `${badgeStart}[\\s\\S]*?${badgeEnd}`
            );

            if (!badgeBlockRe.test(currentReadme)) {
              core.setFailed(
                `Could not find ${badgeStart} ... ${badgeEnd} markers in ${readmePath}`
              );
              return;
            }

            const nextReadme = currentReadme.replace(
              badgeBlockRe,
              renderBadgeBlock(workshops, contributors)
            );

            const summary = [
              '## Organization stats badges',
              '',
              '| Metric | Count |',
              '|--------|-------|',
              `| Repos scanned | ${repos.length} |`,
              `| Workshops | ${workshops} |`,
              `| Unique contributors | ${contributors} |`,
              `| Contributor fetch errors | ${errors.length} |`
            ];

            if (errors.length > 0) {
              summary.push('', '### Contributor fetch errors', ...errors.map((e) => `- ${e}`));
            }

            if (nextReadme === currentReadme) {
              summary.push('', 'README badges already up to date; no commit.');
              await core.summary.addRaw(summary.join('\n')).write();
              core.info('README badges already up to date.');
              return;
            }

            const { data: existing } = await github.rest.repos.getContent({
              owner,
              repo: repoName,
              path: readmePath,
              ref: 'main'
            });

            if (Array.isArray(existing) || existing.type !== 'file') {
              core.setFailed(`${readmePath} is not a file on main`);
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo: repoName,
              path: readmePath,
              message: 'chore: update organization stats badges',
              content: Buffer.from(nextReadme).toString('base64'),
              branch: 'main',
              sha: existing.sha
            });

            summary.push('', 'Committed updated badges directly to `main`.');
            await core.summary.addRaw(summary.join('\n')).write();
            core.info(
              `Pushed badge updates to main (workshops=${workshops}, contributors=${contributors})`
            );
